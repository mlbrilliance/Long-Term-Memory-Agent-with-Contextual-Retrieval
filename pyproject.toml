[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltm-agent"
version = "0.1.0"
description = "Long-Term Memory Agent with Contextual Retrieval"
authors = [
    {name = "Synapse Initiative Team"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "B", "C4", "ARG", "SIM", "UP"]
ignore = ["E203"]  # Conflicts with black
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "owl",
    "mcp.json"
]

[tool.ruff.lint.isort]
known-first-party = ["ltm_agent"]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".","src"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]
addopts = "-v --cov=src/ltm_agent"
